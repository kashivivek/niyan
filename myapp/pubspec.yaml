name: myapp
description: "A property management application built with Flutter and Firebase."

publish_to: 'none'

version: 1.5.1+10



environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_app_check: ^0.4.6
  firebase_storage: ^13.4.6

  # State Management
  provider: ^6.1.2

  # UI & Fonts
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.6
  fl_chart: ^1.2.0
  uuid: ^4.4.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  async: ^2.13.0
  rxdart: ^0.28.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  universal_html: ^2.3.0
  go_router: ^18.0.1
  home_widget: ^0.9.1

  # Phase 2: Security & Visitor Management
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo_icon.png"
  android_12:
    image: "assets/images/logo_icon.png"
    color: "#ffffff"

